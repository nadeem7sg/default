apiVersion: dsdf.7sg.ai/v1
kind: DataSourceDefinition
metadata:
  name: llm-endpoint-crusoe
  version: 1.0.0
  tags:
    env: prod
home:
  tdfRef: crusoe
connection:
  type: api
  provider: openai-compatible
  endpoint: https://${CRUSOE_AI_ENDPOINT}/v1
  resource: models/${CRUSOE_MODEL_ID}
  notes: OpenAI-compatible endpoint hosted on Crusoe (used in Endpoints-at-Crusoe
    scenario).
auth:
  method: apikey
  secretRefs:
  - crusoe-openai-api-key
secrets:
  provider: inherit
  inheritFromWdf: true
  secretRefs: []
