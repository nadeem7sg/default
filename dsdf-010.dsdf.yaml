apiVersion: dsdf.7sg.ai/v1
kind: DataSourceDefinition
metadata:
  name: dsdf-010
  version: "1.0.0"
  tags:
    env: prod
home:
  tdfRef: azure-east
connection:
  type: vector-store
  provider: provider-0
  endpoint: https://example.com
  resource: example-resource
vectorIndex:
  name: dsdf-010-index
  dims: 1536
  metric: cosine
auth:
  method: apikey
  secretRefs:
    - dsdf-010-key
secrets:
  provider: inherit
  inheritFromWdf: true
  secretRefs: []
