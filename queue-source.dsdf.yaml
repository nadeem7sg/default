apiVersion: dsdf.7sg.ai/v1
kind: DataSourceDefinition
metadata:
  name: queue-source
  version: "1.0.0"
  tags:
    env: prod
home:
  tdfRef: azure-east
connection:
  type: queue
  provider: azure-event-hubs
  endpoint: https://example.com
  resource: example-resource
auth:
  method: apikey
  secretRefs:
    - queue-source-key
secrets:
  provider: inherit
  inheritFromWdf: true
  secretRefs: []
