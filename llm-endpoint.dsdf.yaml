apiVersion: dsdf.7sg.ai/v1
kind: DataSourceDefinition
metadata:
  name: llm-endpoint
  version: 1.0.0
  tags:
    env: prod
home:
  tdfRef: azure-east
connection:
  type: api
  provider: openai-compatible
  endpoint: https://${AZURE_OPENAI_RESOURCE}.openai.azure.com/
  resource: deployments/gpt-4.1-mini
  notes: OpenAI-compatible endpoint used to generate Spark SQL and (optionally) narratives.
auth:
  method: apikey
  secretRefs:
  - name: openai-api-key
    injectAs: env
secrets:
  provider: inherit
  inheritFromWdf: true
  secretRefs: []
