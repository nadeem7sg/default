apiVersion: dsdf.7sg.ai/v1
kind: DataSourceDefinition
metadata:
  name: llm-endpoint
  version: "1.0.0"
  tags:
    env: prod
home:
  tdfRef: azure-east
connection:
  type: api
  provider: azure-openai
  endpoint: https://example-openai.openai.azure.com/
  resource: deployments/gpt-4.1-mini
auth:
  method: apikey
  secretRefs:
    - azure-openai-api-key
secrets:
  provider: azureKeyVault
  inheritFromWdf: false
  secretRefs:
    - name: azure-openai-api-key
      injectAs: env
      envVar: AZURE_OPENAI_API_KEY
      externalRef:
        provider: azure-keyvault
        key: azure-openai-api-key
