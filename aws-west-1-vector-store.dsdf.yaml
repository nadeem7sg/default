apiVersion: dsdf.7sg.ai/v1
kind: DataSourceDefinition
metadata:
  name: aws-west-1-vector-store-018
  version: "1.0.0"
  tags:
    env: prod
home:
  tdfRef: aws-west-1
connection:
  type: vector-store
  provider: openai-compatible
  endpoint: https://example.com
  resource: example-resource
vectorIndex:
  name: aws-west-1-vector-store-018-index
  dims: 1536
  metric: cosine
auth:
  method: apikey
  secretRefs:
    - aws-west-1-vector-store-018-key
secrets:
  provider: inherit
  inheritFromWdf: true
  secretRefs: []
