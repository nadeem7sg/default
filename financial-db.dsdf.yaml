apiVersion: dsdf.7sg.ai/v1
kind: DataSourceDefinition
metadata:
  name: financial-db
  version: "1.0.0"
  tags:
    env: prod
home:
  tdfRef: azure-east
connection:
  type: database
  provider: azure-sql
  endpoint: financial-db.database.windows.net
  database: financial-analysis
  resource: financial-analysis
auth:
  method: azure-managed-identity
  secretRefs: []
secrets:
  provider: inherit
  inheritFromWdf: true
  secretRefs: []
