apiVersion: tdf.7sg.ai/v1
kind: TargetDefinition
metadata:
  name: azure-east
  version: "1.0.0"
  displayName: Azure East (logical target)
  description: Azure target spanning eastus/eastus2 used by Financial Analysis workloads.
  tags:
    provider: azure
    geo: us
    tier: native
target:
  regions:
    - eastus
    - eastus2
  geography:
    continent: na
    country: us
    zoneGroup: us-central
  networking:
    defaultNetworkPolicy: private
  services:
    - name: aks
      type: kubernetes
      providerService: AKS
      defaults:
        namespace: financial-analysis
    - name: synapse
      type: spark
      providerService: Azure Synapse Spark
    - name: adls
      type: object-store
      providerService: ADLS Gen2
    - name: keyvault
      type: secrets
      providerService: Azure Key Vault
    - name: managed-identity
      type: identity
      providerService: Managed Identity
    - name: observability
      type: observability
      providerService: Azure Monitor / Log Analytics
