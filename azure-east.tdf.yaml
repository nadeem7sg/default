apiVersion: tdf.7sg.ai/v1
kind: TargetDefinition
metadata:
  name: azure-east
  version: "1.0.0"
  displayName: Azure East Happy Path
  description: Logical Azure target for financial-analysis happy-path ingest testing.
  tags:
    provider: azure
    geo: us
    tier: ingest-happy-path
target:
  provider: azure
  regions:
    - eastus2
  geography:
    continent: na
    country: us
    zoneGroup: us-east
  networking:
    defaultNetworkPolicy: private
  services:
    - name: container-apps
      type: container-apps
      providerService: Azure Container Apps
      defaults:
        resourceGroup: rg-financial-analysis
        namespace: financial-analysis
    - name: container-registry
      type: container-registry
      providerService: Azure Container Registry
      defaults:
        resourceGroup: rg-financial-analysis
        account: uvfinancialsourceacr
    - name: synapse
      type: spark
      providerService: Azure Synapse Spark
    - name: adls
      type: object-store
      providerService: Azure Data Lake Storage Gen2
    - name: keyvault
      type: secrets
      providerService: Azure Key Vault
    - name: monitor
      type: observability
      providerService: Azure Monitor
