apiVersion: dsdf.7sg.ai/v1
kind: DataSourceDefinition
metadata:
  name: deep-store
  version: "1.0.0"
  tags:
    env: prod
home:
  tdfRef: azure-east
connection:
  type: object-store
  provider: adls-gen2
  endpoint: https://example.com
  resource: example-resource
auth:
  method: apikey
  secretRefs:
    - deep-store-key
secrets:
  provider: inherit
  inheritFromWdf: true
  secretRefs: []
