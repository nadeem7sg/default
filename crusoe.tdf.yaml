apiVersion: tdf.7sg.ai/v1
kind: TargetDefinition
metadata:
  name: crusoe
  displayName: Crusoe US (logical target)
  description: Logical Crusoe Cloud target for running app containers and (optionally)
    AI endpoints.
  version: 1.0.0
  tags:
    provider: crusoe
    geo: us
    tier: alternate
target:
  provider: crusoe
  regions:
  - your-region-name
  geography:
    continent: na
    country: us
    zoneGroup: us-central
  networking:
    defaultNetworkPolicy: private
  services:
  - name: crusoe-k8s
    type: kubernetes
    providerService: Crusoe Kubernetes
    capabilities:
      gpuTypes:
      - L40S
      supportsOIDCWorkloadIdentity: true
    defaults:
      namespace: financial-analysis
  - name: crusoe-ai
    type: ml-platform
    providerService: Crusoe AI Endpoints
    endpoints:
      openaiCompatible: https://${CRUSOE_AI_ENDPOINT}/v1
    capabilities:
      gpuTypes:
      - L40S
  - name: vast
    type: object-store
    providerService: VAST (S3-compatible)
    endpoints:
      s3: https://${VAST_S3_ENDPOINT}
  - name: secrets
    type: secrets
    providerService: External Secrets / Vault
  - name: identity
    type: identity
    providerService: OIDC / Workload Identity
  - name: observability
    type: observability
    providerService: Prometheus / Grafana / Logs
  - name: kafka-bridge
    type: queue
    providerService: Kafka (Strimzi/Confluent)
    endpoints:
      bootstrap: ${CRUSOE_KAFKA_BOOTSTRAP}:9093
    capabilities:
      supportsTLS: true
      supportsSASL: true
    availability:
      sla: best-effort
  infrastructure:
    clusters:
    - name: ${CRUSOE_K8S_CLUSTER}
      service: crusoe-k8s
