apiVersion: dsdf.7sg.ai/v1
kind: DataSourceDefinition
metadata:
  name: edge-fleet-vector-store-038
  version: "1.0.0"
  tags:
    env: prod
home:
  tdfRef: edge-fleet
connection:
  type: vector-store
  provider: openai-compatible
  endpoint: https://example.com
  resource: example-resource
vectorIndex:
  name: edge-fleet-vector-store-038-index
  dims: 1536
  metric: cosine
auth:
  method: apikey
  secretRefs:
    - edge-fleet-vector-store-038-key
secrets:
  provider: inherit
  inheritFromWdf: true
  secretRefs: []
