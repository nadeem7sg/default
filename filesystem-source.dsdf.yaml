apiVersion: dsdf.7sg.ai/v1
kind: DataSourceDefinition
metadata:
  name: filesystem-source
  version: "1.0.0"
  tags:
    env: prod
home:
  tdfRef: azure-east
connection:
  type: filesystem
  provider: local-disk
  endpoint: https://example.com
  resource: example-resource
auth:
  method: apikey
  secretRefs:
    - filesystem-source-key
secrets:
  provider: inherit
  inheritFromWdf: true
  secretRefs: []
