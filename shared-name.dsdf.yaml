apiVersion: dsdf.7sg.ai/v1
kind: DataSourceDefinition
metadata:
  name: shared-name
  version: "1.0.0"
  tags:
    env: prod
home:
  tdfRef: shared-name
connection:
  type: api
  provider: openai-compatible
  endpoint: https://sherpa.openai.azure.com/
  resource: deployments/gpt-4.1-mini
  notes: OpenAI-compatible endpoint used to generate Spark SQL.
auth:
  method: apikey
  secretRefs:
    - openai-api-key
secrets:
  provider: inherit
  inheritFromWdf: true
  secretRefs: []
