apiVersion: dsdf.7sg.ai/v1
kind: DataSourceDefinition
metadata:
  name: warehouse-source
  version: "1.0.0"
  tags:
    env: prod
home:
  tdfRef: azure-east
connection:
  type: warehouse
  provider: azure-synapse-spark
  endpoint: https://example.com
  resource: example-resource
auth:
  method: apikey
  secretRefs:
    - warehouse-source-key
secrets:
  provider: inherit
  inheritFromWdf: true
  secretRefs: []
