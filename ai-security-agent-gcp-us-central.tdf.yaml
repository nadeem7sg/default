apiVersion: tdf.7sg.ai/v1
kind: TargetDefinition
metadata:
  name: ai-security-agent-gcp-us-central
  version: "1.0.0"
  displayName: GCP US Central - Cloud Run + Vertex AI
  description: >
    GCP target for the AI Security Agent. Cloud Run for serverless
    container hosting and Vertex AI for Gemini model access (both
    Pro for red-teaming and Flash as target).
  tags:
    provider: gcp
    geo: us
    tier: native
target:
  provider: gcp
  regions:
    - us-central1
  geography:
    continent: na
    country: us
    metro: iowa
  networking:
    defaultNetworkPolicy: public
  services:
    - name: cloud-run
      type: serverless
      providerService: Cloud Run
      defaults:
        namespace: default
      capabilities:
        supportsOIDCWorkloadIdentity: true
        supportsPrivateEndpoints: true
      quotas:
        maxCPUCores: 8
        maxMemoryGiB: 32
    - name: vertex-ai
      type: ml-platform
      providerService: Vertex AI (Gemini)
      endpoints:
        api: https://us-central1-aiplatform.googleapis.com
      capabilities:
        supportsOIDCWorkloadIdentity: true
      availability:
        slaTier: standard
        supportedRegions:
          - us-central1
          - us-east1
          - europe-west1
    - name: secret-manager
      type: secrets
      providerService: Secret Manager
      capabilities:
        supportsPrivateEndpoints: true
    - name: artifact-registry
      type: container-registry
      providerService: Artifact Registry
      endpoints:
        registry: us-central1-docker.pkg.dev
    - name: cloud-logging
      type: observability
      providerService: Cloud Logging + Cloud Monitoring
    - name: iam
      type: identity
      providerService: IAM + Workload Identity
  infrastructure:
    clusters: []
    secretStores:
      - name: gcp-secret-manager
        service: secret-manager
  credentialProfiles:
    - name: gcp
      source: internal_vault
      required: true
      kind: service_account
      ref: gcp-sa-key-json
      fields:
        project: gcp-secret-manager-project-id
    - name: gcp-registry
      source: internal_vault
      required: false
      purpose: registry
      kind: service_account
      ref: gcp-sa-key-json