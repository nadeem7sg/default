apiVersion: dsdf.7sg.ai/v1
kind: DataSourceDefinition
metadata:
  name: aws-east-1-vector-store-013
  version: "1.0.0"
  tags:
    env: prod
home:
  tdfRef: aws-east-1
connection:
  type: vector-store
  provider: openai-compatible
  endpoint: https://example.com
  resource: example-resource
vectorIndex:
  name: aws-east-1-vector-store-013-index
  dims: 1536
  metric: cosine
auth:
  method: apikey
  secretRefs:
    - aws-east-1-vector-store-013-key
secrets:
  provider: inherit
  inheritFromWdf: true
  secretRefs: []
