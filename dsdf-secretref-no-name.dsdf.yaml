apiVersion: dsdf.7sg.ai/v1
kind: DataSourceDefinition
metadata:
  name: dsdf-secretref-no-name
  version: "1.0.0"
  tags:
    env: prod
home:
  tdfRef: azure-east
connection:
  type: api
  provider: openai-compatible
  endpoint: https://sherpa.openai.azure.com/
  resource: deployments/gpt-4.1-mini
auth:
  method: apikey
  secretRefs:
    - openai-api-key
secrets:
  provider: vault
  secretRefs:
    - injectAs: env
      envVar: OPENAI_API_KEY
