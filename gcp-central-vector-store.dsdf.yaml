apiVersion: dsdf.7sg.ai/v1
kind: DataSourceDefinition
metadata:
  name: gcp-central-vector-store-023
  version: "1.0.0"
  tags:
    env: prod
home:
  tdfRef: gcp-central
connection:
  type: vector-store
  provider: openai-compatible
  endpoint: https://example.com
  resource: example-resource
vectorIndex:
  name: gcp-central-vector-store-023-index
  dims: 1536
  metric: cosine
auth:
  method: apikey
  secretRefs:
    - gcp-central-vector-store-023-key
secrets:
  provider: inherit
  inheritFromWdf: true
  secretRefs: []
