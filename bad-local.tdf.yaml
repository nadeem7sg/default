apiVersion: tdf.7sg.ai/v1
kind: TargetDefinition
metadata:
  name: bad-local
  displayName: Local Development
  description: Developer laptop / docker-desktop / kind/minikube target for local validation.
  tags:
    provider: onprem
    geo: local
    tier: dev
target:
  provider: onprem
  regions:
    - local
  networking:
    defaultNetworkPolicy: public
  services:
    - name: docker
      type: custom
      providerService: Docker Desktop / Podman
    - name: kind
      type: kubernetes
      providerService: kind/minikube
      defaults:
        namespace: financial-analysis
    - name: filesystem
      type: file-store
      providerService: Local filesystem
